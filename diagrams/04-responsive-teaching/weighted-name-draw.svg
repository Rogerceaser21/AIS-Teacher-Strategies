<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Weighted name draw"><title>Weighted name draw</title><desc>Jar on desk · prep 10 min · no extra time</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Weighted name draw</text><text x="20" y="42" class="s" text-anchor="start">Jar on desk · prep 10 min · no extra time</text><g><path d="M150 118 l8 84 q52 14 104 0 l8 -84 z" class="fillw"/><path d="M150 118 l8 84 q52 14 104 0 l8 -84 z" class="stroke"/><rect x="146" y="108" width="128" height="12" rx="3" class="stroke"/><line x1="168" y1="96" x2="172" y2="128" class="stroke"/><line x1="182" y1="102" x2="186" y2="128" class="stroke"/><line x1="196" y1="108" x2="200" y2="128" class="acc"/><line x1="210" y1="96" x2="214" y2="128" class="acc"/><line x1="224" y1="102" x2="228" y2="128" class="stroke"/><line x1="238" y1="108" x2="242" y2="128" class="stroke"/><line x1="252" y1="96" x2="256" y2="128" class="acc"/><line x1="266" y1="102" x2="270" y2="128" class="stroke"/><text x="210" y="84" class="la" text-anchor="middle">duplicates for pupils you must hear from</text><line x1="288" y1="150" x2="325.4" y2="150.0" class="acc"/><path d="M330 150 L321.4 152.2 M330 150 L321.4 147.8" class="acc"/><text x="309.0" y="141.0" class="la halo" text-anchor="middle">draw</text><circle cx="352" cy="150" r="9" class="stroke"/><line x1="330" y1="178" x2="292.6" y2="178.0" class="acc dash"/><path d="M288 178 L296.6 175.8 M288 178 L296.6 180.2" class="acc"/><text x="348" y="182" class="lm" text-anchor="middle">stick returns</text><text x="210" y="232" class="lm" text-anchor="middle">thinking time first, then draw. nobody is safe after their turn</text></g></svg>