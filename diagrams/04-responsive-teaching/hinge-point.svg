<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Hinge point"><title>Hinge point</title><desc>Mid lesson · prep 15 min per question · 2 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Hinge point</text><text x="20" y="42" class="s" text-anchor="start">Mid lesson · prep 15 min per question · 2 min</text><g><rect x="28" y="72" width="176" height="96" rx="4" class="fillw"/><rect x="28" y="72" width="176" height="96" rx="4" class="stroke"/><text x="116.0" y="180" class="lm" text-anchor="middle">one question, 4 options</text><text x="44" y="96" class="l" text-anchor="start">A  misconception 1</text><text x="44" y="116" class="la" text-anchor="start">B  correct</text><text x="44" y="136" class="l" text-anchor="start">C  misconception 2</text><text x="44" y="156" class="l" text-anchor="start">D  misconception 3</text><circle cx="230" cy="92" r="8" class="stroke"/><circle cx="256" cy="92" r="8" class="filla"/><circle cx="256" cy="92" r="8" class="acc"/><circle cx="282" cy="92" r="8" class="stroke"/><circle cx="230" cy="118" r="8" class="stroke"/><circle cx="256" cy="118" r="8" class="filla"/><circle cx="256" cy="118" r="8" class="acc"/><circle cx="282" cy="118" r="8" class="stroke"/><circle cx="230" cy="144" r="8" class="stroke"/><circle cx="256" cy="144" r="8" class="stroke"/><circle cx="282" cy="144" r="8" class="stroke"/><text x="256" y="160" class="lm" text-anchor="middle">answered at once</text><rect x="28" y="186" width="176" height="42" rx="2" class="filla"/><rect x="28" y="186" width="176" height="42" rx="2" class="acc"/><text x="116.0" y="210.4" class="la" text-anchor="middle">strong → move on</text><rect x="214" y="186" width="176" height="42" rx="2" class="filla"/><rect x="214" y="186" width="176" height="42" rx="2" class="acc"/><text x="302.0" y="210.4" class="la" text-anchor="middle">weak → reteach now</text><text x="210" y="248" class="lm" text-anchor="middle">two next moves prepared before the lesson</text></g></svg>