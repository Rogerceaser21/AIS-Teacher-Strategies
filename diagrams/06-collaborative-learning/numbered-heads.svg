<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Numbered heads"><title>Numbered heads</title><desc>Tables of four · prep 5 min · no extra time</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Numbered heads</text><text x="20" y="42" class="s" text-anchor="start">Tables of four · prep 5 min · no extra time</text><g><rect x="84" y="106" width="60" height="44" rx="4" class="fillp"/><rect x="84" y="106" width="60" height="44" rx="4" class="stroke"/><circle cx="70" cy="118" r="8" class="stroke"/><text x="70" y="121.4" class="lm" text-anchor="middle">1</text><circle cx="158" cy="118" r="8" class="stroke"/><text x="158" y="121.4" class="lm" text-anchor="middle">2</text><circle cx="70" cy="140" r="8" class="stroke"/><text x="70" y="143.4" class="lm" text-anchor="middle">3</text><circle cx="158" cy="140" r="8" class="stroke"/><text x="158" y="143.4" class="lm" text-anchor="middle">4</text><rect x="264" y="106" width="60" height="44" rx="4" class="fillp"/><rect x="264" y="106" width="60" height="44" rx="4" class="stroke"/><circle cx="250" cy="118" r="8" class="stroke"/><text x="250" y="121.4" class="lm" text-anchor="middle">1</text><circle cx="338" cy="118" r="8" class="stroke"/><text x="338" y="121.4" class="lm" text-anchor="middle">2</text><circle cx="250" cy="140" r="8" class="filla"/><circle cx="250" cy="140" r="8" class="acc"/><text x="250" y="143.4" class="la" text-anchor="middle">3</text><circle cx="338" cy="140" r="8" class="stroke"/><text x="338" y="143.4" class="lm" text-anchor="middle">4</text><rect x="158" y="194" width="104" height="26" rx="2" class="filla"/><rect x="158" y="194" width="104" height="26" rx="2" class="acc"/><text x="210.0" y="210.4" class="la" text-anchor="middle">draw a number</text><line x1="240" y1="192" x2="265.3" y2="157.7" class="acc"/><path d="M268 154 L264.7 162.3 M268 154 L261.1 159.6" class="acc"/><text x="210" y="244" class="lm" text-anchor="middle">any number can be called, so the group brings everyone up to speed</text><text x="210" y="74" class="la" text-anchor="middle">one pupil reports for the whole group</text></g></svg>