<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="One pen, four hands"><title>One pen, four hands</title><desc>Table of four · prep 1 min · 10 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">One pen, four hands</text><text x="20" y="42" class="s" text-anchor="start">Table of four · prep 1 min · 10 min</text><g><rect x="140" y="82" width="140" height="96" rx="4" class="fillp"/><rect x="140" y="82" width="140" height="96" rx="4" class="stroke"/><text x="210" y="98" class="lm" text-anchor="middle">one A3 sheet</text><line x1="156" y1="112" x2="264" y2="112" class="stroke"/><line x1="156" y1="128" x2="264" y2="128" class="stroke"/><line x1="156" y1="144" x2="264" y2="144" class="stroke"/><line x1="156" y1="160" x2="264" y2="160" class="stroke"/><line x1="226" y1="168" x2="240" y2="160" class="acc"/><path d="M240 160 l4 -2 -2 4 z" class="acc"/><circle cx="104" cy="104" r="10" class="filla"/><circle cx="104" cy="104" r="10" class="acc"/><circle cx="104" cy="156" r="10" class="stroke"/><circle cx="316" cy="104" r="10" class="stroke"/><circle cx="316" cy="156" r="10" class="stroke"/><line x1="120" y1="96" x2="131.5" y2="93.1" class="acc dash"/><path d="M136 92 L128.2 96.2 M136 92 L127.1 92.0" class="acc"/><line x1="284" y1="92" x2="295.5" y2="94.9" class="acc dash"/><path d="M300 96 L291.1 96.0 M300 96 L292.2 91.8" class="acc"/><line x1="300" y1="164" x2="288.5" y2="166.9" class="acc dash"/><path d="M284 168 L291.8 163.8 M284 168 L292.9 168.0" class="acc"/><line x1="136" y1="168" x2="124.5" y2="165.1" class="acc dash"/><path d="M120 164 L128.9 164.0 M120 164 L127.8 168.2" class="acc"/><text x="210" y="202" class="la" text-anchor="middle">pen passes after every sentence</text><text x="210" y="224" class="lm" text-anchor="middle">each pupil signs their own sentences in their own colour</text><text x="210" y="244" class="lm" text-anchor="middle">you read the colours, not the content</text></g></svg>