<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Silent build"><title>Silent build</title><desc>Floor or joined tables · prep 10 min · 8 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Silent build</text><text x="20" y="42" class="s" text-anchor="start">Floor or joined tables · prep 10 min · 8 min</text><g><rect x="96" y="84" width="228" height="104" rx="4" class="fillw"/><rect x="96" y="84" width="228" height="104" rx="4" class="stroke"/><rect x="112" y="100" width="44" height="30" rx="2" class="fillp"/><rect x="112" y="100" width="44" height="30" rx="2" class="stroke"/><rect x="164" y="100" width="44" height="30" rx="2" class="fillp"/><rect x="164" y="100" width="44" height="30" rx="2" class="stroke"/><rect x="216" y="100" width="44" height="30" rx="2" class="filla"/><rect x="216" y="100" width="44" height="30" rx="2" class="acc"/><rect x="268" y="100" width="44" height="30" rx="2" class="fillp"/><rect x="268" y="100" width="44" height="30" rx="2" class="stroke"/><rect x="112" y="140" width="44" height="30" rx="2" class="fillp"/><rect x="112" y="140" width="44" height="30" rx="2" class="stroke"/><rect x="164" y="140" width="44" height="30" rx="2" class="fillp"/><rect x="164" y="140" width="44" height="30" rx="2" class="stroke"/><rect x="216" y="140" width="44" height="30" rx="2" class="filla"/><rect x="216" y="140" width="44" height="30" rx="2" class="acc"/><rect x="268" y="140" width="44" height="30" rx="2" class="fillp"/><rect x="268" y="140" width="44" height="30" rx="2" class="stroke"/><circle cx="360" cy="100" r="13" class="fillw"/><circle cx="360" cy="100" r="13" class="stroke"/><text x="360" y="103.4" class="la" text-anchor="middle">4m</text><text x="360" y="126" class="la" text-anchor="middle">silent</text><circle cx="64" cy="104" r="8" class="stroke"/><circle cx="64" cy="134" r="8" class="stroke"/><circle cx="64" cy="164" r="8" class="stroke"/><line x1="80" y1="134" x2="95.4" y2="134.0" class="acc dash"/><path d="M100 134 L91.4 136.2 M100 134 L91.4 131.8" class="acc"/><text x="210" y="210" class="la" text-anchor="middle">move, place, reorder, gesture · no talking</text><text x="210" y="234" class="lm" text-anchor="middle">talk opens after, from a shared arrangement</text></g></svg>