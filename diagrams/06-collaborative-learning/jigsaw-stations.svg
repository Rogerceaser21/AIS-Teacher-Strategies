<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Jigsaw stations"><title>Jigsaw stations</title><desc>Four stations · prep 20 min · 20 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Jigsaw stations</text><text x="20" y="42" class="s" text-anchor="start">Four stations · prep 20 min · 20 min</text><g><rect x="36" y="88" width="76" height="44" rx="4" class="fillp"/><rect x="36" y="88" width="76" height="44" rx="4" class="stroke"/><text x="74.0" y="113.5" class="l" text-anchor="middle">src 1</text><rect x="136" y="88" width="76" height="44" rx="4" class="fillp"/><rect x="136" y="88" width="76" height="44" rx="4" class="stroke"/><text x="174.0" y="113.5" class="l" text-anchor="middle">src 2</text><rect x="36" y="154" width="76" height="44" rx="4" class="fillp"/><rect x="36" y="154" width="76" height="44" rx="4" class="stroke"/><text x="74.0" y="179.5" class="l" text-anchor="middle">src 3</text><rect x="136" y="154" width="76" height="44" rx="4" class="fillp"/><rect x="136" y="154" width="76" height="44" rx="4" class="stroke"/><text x="174.0" y="179.5" class="l" text-anchor="middle">src 4</text><text x="112" y="76" class="la" text-anchor="middle">round 1 · become the expert</text><line x1="224" y1="132" x2="257.4" y2="132.0" class="acc"/><path d="M262 132 L253.4 134.2 M262 132 L253.4 129.8" class="acc"/><rect x="300" y="110" width="60" height="44" rx="4" class="fillp"/><rect x="300" y="110" width="60" height="44" rx="4" class="stroke"/><circle cx="286" cy="122" r="8" class="filla"/><circle cx="286" cy="122" r="8" class="acc"/><text x="286" y="125.4" class="la" text-anchor="middle">1</text><circle cx="374" cy="122" r="8" class="filla"/><circle cx="374" cy="122" r="8" class="acc"/><text x="374" y="125.4" class="la" text-anchor="middle">2</text><circle cx="286" cy="144" r="8" class="filla"/><circle cx="286" cy="144" r="8" class="acc"/><text x="286" y="147.4" class="la" text-anchor="middle">3</text><circle cx="374" cy="144" r="8" class="filla"/><circle cx="374" cy="144" r="8" class="acc"/><text x="374" y="147.4" class="la" text-anchor="middle">4</text><text x="330" y="76" class="la" text-anchor="middle">round 2 · one expert each</text><text x="210" y="226" class="lm" text-anchor="middle">the task cannot be finished without all four pieces</text></g></svg>