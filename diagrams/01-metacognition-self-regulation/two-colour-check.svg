<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Two colour check"><title>Two colour check</title><desc>Books · prep 5 min once · last 5 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Two colour check</text><text x="20" y="42" class="s" text-anchor="start">Books · prep 5 min once · last 5 min</text><g><rect x="28" y="72" width="120" height="96" rx="4" class="fillw"/><rect x="28" y="72" width="120" height="96" rx="4" class="stroke"/><line x1="36" y1="96.0" x2="140" y2="96.0" class="stroke dash"/><line x1="36" y1="120.0" x2="140" y2="120.0" class="stroke dash"/><line x1="36" y1="144.0" x2="140" y2="144.0" class="stroke dash"/><text x="88.0" y="180" class="lm" text-anchor="middle">3 checks, front of room</text><rect x="180" y="72" width="210" height="130" rx="4" class="fillp"/><rect x="180" y="72" width="210" height="130" rx="4" class="stroke"/><line x1="196" y1="92" x2="374" y2="92" class="stroke"/><line x1="196" y1="112" x2="374" y2="112" class="stroke"/><line x1="196" y1="132" x2="374" y2="132" class="stroke"/><line x1="196" y1="152" x2="374" y2="152" class="stroke"/><line x1="196" y1="172" x2="374" y2="172" class="stroke"/><path d="M204 104 l52 0 M204 144 l70 0" class="acc"/><line x1="300" y1="190" x2="314" y2="182" class="acc"/><path d="M314 182 l4 -2 -2 4 z" class="acc"/><text x="210" y="226" class="la" text-anchor="middle">second colour only: nothing new, only better</text></g></svg>