<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Exit strip"><title>Exit strip</title><desc>Back of door · prep 10 min · 60 seconds</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Exit strip</text><text x="20" y="42" class="s" text-anchor="start">Back of door · prep 10 min · 60 seconds</text><g><rect x="24" y="84" width="12" height="108" rx="2" class="fillw"/><rect x="24" y="84" width="12" height="108" rx="2" class="stroke"/><path d="M36 84 A75.6 75.6 0 0 1 72.72 138.0" class="stroke dash"/><text x="30" y="204" class="lm" text-anchor="middle">inside the door</text><rect x="62" y="90" width="88" height="46" rx="2" class="fillp"/><rect x="62" y="90" width="88" height="46" rx="2" class="stroke"/><text x="106.0" y="116.4" class="l" text-anchor="middle">got it</text><rect x="162" y="90" width="88" height="46" rx="2" class="filla"/><rect x="162" y="90" width="88" height="46" rx="2" class="acc"/><text x="206.0" y="116.4" class="la" text-anchor="middle">nearly</text><rect x="262" y="90" width="88" height="46" rx="2" class="fillp"/><rect x="262" y="90" width="88" height="46" rx="2" class="stroke"/><text x="306.0" y="116.4" class="l" text-anchor="middle">lost me</text><rect x="84" y="146" width="16" height="16" rx="2" class="fillw"/><rect x="84" y="146" width="16" height="16" rx="2" class="stroke"/><rect x="184" y="146" width="16" height="16" rx="2" class="filla"/><rect x="184" y="146" width="16" height="16" rx="2" class="acc"/><rect x="284" y="146" width="16" height="16" rx="2" class="fillw"/><rect x="284" y="146" width="16" height="16" rx="2" class="stroke"/><line x1="240" y1="190" x2="204.0" y2="170.2" class="acc"/><path d="M200 168 L208.6 170.2 M200 168 L206.5 174.1" class="acc"/><text x="252" y="192" class="la" text-anchor="start">named note</text><text x="210" y="228" class="lm" text-anchor="middle">read in 90 seconds, sets the next lesson's first 3 minutes</text></g></svg>