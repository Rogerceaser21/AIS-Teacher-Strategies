<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Countdown reveal"><title>Countdown reveal</title><desc>Wall strip · prep 15 min per unit · 2 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Countdown reveal</text><text x="20" y="42" class="s" text-anchor="start">Wall strip · prep 15 min per unit · 2 min</text><g><rect x="30" y="110" width="52" height="56" rx="2" class="fillp"/><rect x="30" y="110" width="52" height="56" rx="2" class="stroke"/><text x="56.0" y="141.4" class="l" text-anchor="middle">1</text><rect x="92" y="110" width="52" height="56" rx="2" class="fillp"/><rect x="92" y="110" width="52" height="56" rx="2" class="stroke"/><text x="118.0" y="141.4" class="l" text-anchor="middle">2</text><rect x="154" y="110" width="52" height="56" rx="2" class="fillp"/><rect x="154" y="110" width="52" height="56" rx="2" class="stroke"/><text x="180.0" y="141.4" class="l" text-anchor="middle">3</text><rect x="216" y="110" width="52" height="56" rx="2" class="filla"/><rect x="216" y="110" width="52" height="56" rx="2" class="acc"/><text x="242.0" y="141.4" class="la" text-anchor="middle">4</text><rect x="278" y="110" width="52" height="56" rx="2" class="fillp"/><rect x="278" y="110" width="52" height="56" rx="2" class="stroke"/><text x="304.0" y="141.4" class="l" text-anchor="middle">5</text><rect x="340" y="110" width="52" height="56" rx="2" class="fillp"/><rect x="340" y="110" width="52" height="56" rx="2" class="stroke"/><text x="366.0" y="141.4" class="l" text-anchor="middle">6</text><text x="56" y="182" class="lm" text-anchor="middle">turned</text><text x="118" y="182" class="lm" text-anchor="middle">turned</text><text x="180" y="182" class="lm" text-anchor="middle">turned</text><text x="242" y="182" class="lm" text-anchor="middle">turned</text><text x="304" y="182" class="lm" text-anchor="middle">still hidden</text><text x="366" y="182" class="lm" text-anchor="middle">resolves it</text><line x1="210" y1="92" x2="210.0" y2="99.4" class="acc"/><path d="M210 104 L207.8 95.4 M210 104 L212.2 95.4" class="acc"/><text x="210" y="84" class="la" text-anchor="middle">one card per lesson</text><text x="210" y="216" class="lm" text-anchor="middle">"what does card 4 change about Tuesday?"</text></g></svg>