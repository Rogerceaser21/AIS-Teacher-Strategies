<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Wrong answer wall"><title>Wrong answer wall</title><desc>One wall panel · prep 5 min · 4 min weekly</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Wrong answer wall</text><text x="20" y="42" class="s" text-anchor="start">One wall panel · prep 5 min · 4 min weekly</text><g><rect x="28" y="66" width="250" height="146" rx="4" class="fillw"/><rect x="28" y="66" width="250" height="146" rx="4" class="stroke"/><text x="153.0" y="224" class="lm" text-anchor="middle">plausible wrong answers, unnamed</text><rect x="44" y="82" width="20" height="20" rx="2" class="fillw"/><rect x="44" y="82" width="20" height="20" rx="2" class="stroke"/><rect x="100" y="82" width="20" height="20" rx="2" class="fillw"/><rect x="100" y="82" width="20" height="20" rx="2" class="stroke"/><rect x="156" y="82" width="20" height="20" rx="2" class="fillw"/><rect x="156" y="82" width="20" height="20" rx="2" class="stroke"/><rect x="212" y="82" width="20" height="20" rx="2" class="fillw"/><rect x="212" y="82" width="20" height="20" rx="2" class="stroke"/><rect x="44" y="128" width="20" height="20" rx="2" class="fillw"/><rect x="44" y="128" width="20" height="20" rx="2" class="stroke"/><rect x="100" y="128" width="20" height="20" rx="2" class="filla"/><rect x="100" y="128" width="20" height="20" rx="2" class="acc"/><rect x="156" y="128" width="20" height="20" rx="2" class="fillw"/><rect x="156" y="128" width="20" height="20" rx="2" class="stroke"/><rect x="212" y="128" width="20" height="20" rx="2" class="fillw"/><rect x="212" y="128" width="20" height="20" rx="2" class="stroke"/><rect x="44" y="174" width="20" height="20" rx="2" class="fillw"/><rect x="44" y="174" width="20" height="20" rx="2" class="stroke"/><rect x="100" y="174" width="20" height="20" rx="2" class="fillw"/><rect x="100" y="174" width="20" height="20" rx="2" class="stroke"/><rect x="156" y="174" width="20" height="20" rx="2" class="fillw"/><rect x="156" y="174" width="20" height="20" rx="2" class="stroke"/><line x1="288" y1="132" x2="317.4" y2="132.0" class="acc"/><path d="M322 132 L313.4 134.2 M322 132 L313.4 129.8" class="acc"/><text x="305.0" y="123.0" class="la halo" text-anchor="middle">pick one</text><rect x="326" y="108" width="76" height="48" rx="2" class="filla"/><rect x="326" y="108" width="76" height="48" rx="2" class="acc"/><text x="364.0" y="135.4" class="la" text-anchor="middle">dismantle</text><text x="210" y="244" class="lm" text-anchor="middle">"which of these would fool a sensible person?"</text></g></svg>