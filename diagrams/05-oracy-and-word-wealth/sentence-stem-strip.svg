<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Sentence stem strip"><title>Sentence stem strip</title><desc>Wall pupils face · prep 10 min · no extra time</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Sentence stem strip</text><text x="20" y="42" class="s" text-anchor="start">Wall pupils face · prep 10 min · no extra time</text><g><rect x="24" y="74" width="372" height="30" rx="4" class="fillw"/><rect x="24" y="74" width="372" height="30" rx="4" class="stroke"/><text x="40" y="93" class="l" text-anchor="start">the evidence for that is    ·    I would challenge that because</text><rect x="24" y="112" width="372" height="30" rx="4" class="filla"/><rect x="24" y="112" width="372" height="30" rx="4" class="acc"/><text x="40" y="131" class="la" text-anchor="start">building on what Layla said    ·    that only works if</text><circle cx="56" cy="186" r="9" class="stroke"/><line x1="68" y1="182" x2="108.2" y2="154.6" class="acc dash"/><path d="M112 152 L106.1 158.7 M112 152 L103.6 155.0" class="acc"/><text x="226" y="190" class="la" text-anchor="middle">answers must start with a stem</text><text x="210" y="210" class="lm" text-anchor="middle">pupils may point at the one they are about to use</text><text x="210" y="234" class="lm" text-anchor="middle">seated eye height · refreshed each half term</text></g></svg>