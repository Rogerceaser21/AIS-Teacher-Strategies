<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Talk roles on the table"><title>Talk roles on the table</title><desc>Table centre · prep 15 min · 4 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Talk roles on the table</text><text x="20" y="42" class="s" text-anchor="start">Table centre · prep 15 min · 4 min</text><g><rect x="170" y="118" width="60" height="44" rx="4" class="fillp"/><rect x="170" y="118" width="60" height="44" rx="4" class="stroke"/><circle cx="156" cy="130" r="8" class="stroke"/><text x="156" y="133.4" class="lm" text-anchor="middle">B</text><circle cx="244" cy="130" r="8" class="stroke"/><text x="244" y="133.4" class="lm" text-anchor="middle">C</text><circle cx="156" cy="152" r="8" class="filla"/><circle cx="156" cy="152" r="8" class="acc"/><text x="156" y="155.4" class="la" text-anchor="middle">S</text><circle cx="244" cy="152" r="8" class="stroke"/><text x="244" y="155.4" class="lm" text-anchor="middle">E</text><rect x="170" y="126" width="60" height="28" rx="2" class="filla"/><rect x="170" y="126" width="60" height="28" rx="2" class="acc"/><text x="200.0" y="143.4" class="la" text-anchor="middle">roles</text><text x="64" y="90" class="l" text-anchor="start">B  builder</text><text x="64" y="106" class="l" text-anchor="start">C  challenger</text><text x="276" y="90" class="la" text-anchor="start">S  summariser</text><text x="276" y="106" class="l" text-anchor="start">E  evidence keeper</text><line x1="200" y1="178" x2="200.0" y2="195.4" class="acc"/><path d="M200 200 L197.8 191.4 M200 200 L202.2 191.4" class="acc"/><text x="200" y="216" class="lm" text-anchor="middle">summariser reports in one sentence and names who said what</text><text x="200" y="240" class="lm" text-anchor="middle">take three summarisers, not one · roles rotate every discussion</text></g></svg>