class="stroke"/><rect x="288" y="108" width="44" height="20" rx="2" class="filla"/><rect x="288" y="108" width="44" height="20" rx="2" class="acc"/><rect x="336" y="108" width="44" height="20" rx="2" class="filla"/><rect x="336" y="108" width="44" height="20" rx="2" class="acc"/><text x="334" y="146" class="la" text-anchor="middle">both words appear</text><text x="334" y="160" class="la" text-anchor="middle">in the paragraph</text><line x1="268" y1="178" x2="232.6" y2="178.0" class="acc dash"/><path d="M228 178 L236.6 175.8 M228 178 L236.6 180.2" class="acc"/><text x="300" y="192" class="lm" text-anchor="middle">card returns</text><text x="210" y="244" class="lm" text-anchor="middle">cards nobody takes are dead words: replace them</text></g></svg>