<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Forgetting queue"><title>Forgetting queue</title><desc>Back wall or corridor · prep 10 min · 3 min</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Forgetting queue</text><text x="20" y="42" class="s" text-anchor="start">Back wall or corridor · prep 10 min · 3 min</text><g><line x1="28" y1="96" x2="392" y2="96" class="stroke"/><rect x="36" y="104" width="44" height="44" rx="2" class="filla"/><rect x="36" y="104" width="44" height="44" rx="2" class="acc"/><rect x="88" y="104" width="44" height="44" rx="2" class="filla"/><rect x="88" y="104" width="44" height="44" rx="2" class="acc"/><rect x="140" y="104" width="44" height="44" rx="2" class="fillp"/><rect x="140" y="104" width="44" height="44" rx="2" class="stroke"/><rect x="192" y="104" width="44" height="44" rx="2" class="fillp"/><rect x="192" y="104" width="44" height="44" rx="2" class="stroke"/><rect x="244" y="104" width="44" height="44" rx="2" class="fillp"/><rect x="244" y="104" width="44" height="44" rx="2" class="stroke"/><line x1="58" y1="96" x2="58" y2="104" class="stroke"/><line x1="110" y1="96" x2="110" y2="104" class="stroke"/><line x1="162" y1="96" x2="162" y2="104" class="stroke"/><line x1="214" y1="96" x2="214" y2="104" class="stroke"/><line x1="266" y1="96" x2="266" y2="104" class="stroke"/><text x="120" y="172" class="lm" text-anchor="middle">questions the class fluffed, dated</text><text x="320" y="88" class="la" text-anchor="middle">beaten twice</text><line x1="292" y1="126" x2="325.4" y2="126.0" class="acc"/><path d="M330 126 L321.4 128.2 M330 126 L321.4 123.8" class="acc"/><rect x="338" y="104" width="54" height="44" rx="4" class="filla"/><rect x="338" y="104" width="54" height="44" rx="4" class="acc"/><text x="365.0" y="160" class="la" text-anchor="middle">retired pile</text><text x="210" y="216" class="lm" text-anchor="middle">"two off the queue. beat them and they come down"</text></g></svg>