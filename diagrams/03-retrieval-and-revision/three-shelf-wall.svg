<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Three shelf knowledge wall"><title>Three shelf knowledge wall</title><desc>One wall · prep 20 min · 5 min starter</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Three shelf knowledge wall</text><text x="20" y="42" class="s" text-anchor="start">One wall · prep 20 min · 5 min starter</text><g><rect x="28" y="72" width="300" height="34" rx="4" class="fillw"/><rect x="28" y="72" width="300" height="34" rx="4" class="stroke"/><text x="178" y="94" class="l" text-anchor="middle">band 1 · this fortnight · 1 question</text><rect x="28" y="116" width="300" height="34" rx="4" class="fillw"/><rect x="28" y="116" width="300" height="34" rx="4" class="stroke"/><text x="178" y="138" class="l" text-anchor="middle">band 2 · this term · 2 questions</text><rect x="28" y="160" width="300" height="34" rx="4" class="filla"/><rect x="28" y="160" width="300" height="34" rx="4" class="acc"/><text x="178" y="182" class="la" text-anchor="middle">band 3 · last year · 3 questions</text><line x1="344" y1="88" x2="344.0" y2="171.4" class="acc dash"/><path d="M344 176 L341.8 167.4 M344 176 L346.2 167.4" class="acc"/><text x="352" y="134" class="lm" text-anchor="start">items age</text><text x="352" y="148" class="lm" text-anchor="start">downward,</text><text x="352" y="162" class="lm" text-anchor="start">never removed</text><text x="178" y="224" class="lm" text-anchor="middle">"two from the bottom shelf first"</text></g></svg>